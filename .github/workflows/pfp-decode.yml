# bunkyseal repo root: .github/workflows/pfp-decode.yml  (sibling of og-decode.yml; does not touch play/og)
name: pfp-decode
on:
  push:
    paths: ['pfp/*.png.b64', 'pfp/MANIFEST.txt']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Decode pfp/*.png.b64 and verify against MANIFEST
        run: |
          set -euo pipefail
          cd pfp
          [ "$(wc -l < MANIFEST.txt)" = 1 ] || { echo "MANIFEST must list exactly 1 file"; exit 1; }
          while read -r sha name; do
            [[ "$name" =~ ^[a-z0-9-]+\.png$ ]] || { echo "bad name: $name"; exit 1; }
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha: $name"; exit 1; }
            base64 -d "$name.b64" > "$name"
            echo "$sha  $name" | sha256sum -c - || { rm -f "$name"; exit 1; }
          done < MANIFEST.txt
      - name: Commit PNGs
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add pfp/*.png
          if ! git diff --cached --quiet; then git commit -m "pfp: decode PNG (sha256 verified)"; git push; fi
